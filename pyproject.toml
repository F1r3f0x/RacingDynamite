[project]
name = "racing-dynamite"
version = "0.1.0"
description = "Modern open-source reverse engineering and source port tools for Ignition (1997)"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Patricio Labin Correa (@F1r3f0x)", email = "plabin@outlook.cl" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp<2",
    "pymem>=1.14.0",
    "requests>=2.34.2",
]

[project.scripts]
racing-dynamite = "racing_dynamite:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
